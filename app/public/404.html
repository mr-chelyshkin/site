<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Igor Chelyshkin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-display-semibold-4.1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      @font-face {
        font-family: 'Inter Display';
        src: url('/fonts/inter-display-semibold-4.1.woff2') format('woff2');
        font-style: normal;
        font-weight: 600;
        font-display: swap;
      }

      /* CloudFront serves this document directly, including at nested URLs.
         Keep it self-contained; mirror the site's paper, type and poster spacing. */
      :root {
        --color-background-main: #f7f7f2;
        --color-text-main: #171717;
        --color-text-muted: #5f5f5c;
        --color-rule-main: rgb(23 23 23 / 16%);
        --signal-cool: #58b9c0;
        --signal-warm: #d58c64;
        --poster-gutter: clamp(1.25rem, 5vw, 5rem);
        --poster-block: clamp(3.5rem, 7vw, 7rem);
        --poster-gap: clamp(2.5rem, 5vw, 5rem);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: var(--color-text-main);
        background: var(--color-background-main);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }

      .site-header {
        border-bottom: 1px solid var(--color-text-main);
      }

      .site-header__inner {
        display: flex;
        align-items: center;
        min-height: 72px;
        max-width: 1600px;
        margin-inline: auto;
        padding-inline: var(--poster-gutter);
      }

      .site-header__identity {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        min-height: 44px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .site-header__identity img {
        flex: none;
      }

      .not-found {
        max-width: 1600px;
        margin-inline: auto;
        padding: var(--poster-block) var(--poster-gutter);
      }

      .not-found-code {
        --signal-offset: -0.025em;
        position: relative;
        width: fit-content;
        margin: 0 0 var(--poster-gap);
        font-size: clamp(7rem, 22vw, 20rem);
        font-weight: 600;
        line-height: 0.8;
        letter-spacing: -0.05em;
      }

      .not-found-code,
      .not-found-title {
        font-family: 'Inter Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }

      .not-found-code__slice {
        position: absolute;
        inset: 0;
        background: var(--color-background-main);
        clip-path: inset(31% 0 57% 4%);
        transform: translateX(var(--signal-offset));
        text-shadow:
          -0.012em 0 var(--signal-cool),
          0.012em 0 var(--signal-warm);
        pointer-events: none;
        user-select: none;
      }

      .not-found-code__slice--echo {
        --signal-drift: -1;
        clip-path: inset(74% 58% 16% 0);
        transform: translateX(calc(var(--signal-offset) * -1));
      }

      .not-found-title {
        margin: 0;
        font-size: clamp(2.5rem, 5.6vw, 5.5rem);
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        text-wrap: balance;
      }

      .not-found-message {
        max-width: 46ch;
        margin: 1.5rem 0 0;
        color: var(--color-text-muted);
        font-size: clamp(1rem, 1.35vw, 1.25rem);
        line-height: 1.5;
        letter-spacing: -0.01em;
      }

      .not-found-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem 2.5rem;
        margin-top: var(--poster-gap);
        padding-top: 1.25rem;
        border-top: 1px solid var(--color-rule-main);
      }

      .not-found-link {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        min-height: 44px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      .not-found-link__label {
        position: relative;
      }

      .not-found-link__label::after {
        content: '';
        position: absolute;
        top: 50%;
        right: -0.25rem;
        left: -0.25rem;
        height: max(1px, 0.025em);
        background: currentColor;
        transform: translateY(-50%) scaleX(0);
        transform-origin: left;
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .not-found-link:hover .not-found-link__label::after {
        transform: translateY(-50%) scaleX(1);
      }

      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .not-found-code:hover .not-found-code__slice {
          animation: signal-drift 520ms steps(1, end) 1;
        }

        .not-found-code:hover .not-found-code__slice--echo {
          animation-duration: 640ms;
        }

        @keyframes signal-drift {
          0%,
          100% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1)));
          }
          15% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1) * -3.5));
          }
          35% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1) * 4.5));
          }
          55% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1) * -1.5));
          }
          75% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1) * 5.5));
          }
          90% {
            transform: translateX(calc(var(--signal-offset) * var(--signal-drift, 1) * -2.5));
          }
        }
      }

      @media (max-width: 64rem) {
        .not-found-title {
          font-size: clamp(2.25rem, 8vw, 4rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .not-found-link__label::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__identity" href="/" aria-label="Igor Chelyshkin, home">
          <img src="/favicon.svg" alt="" width="28" height="28" />
          <span>Igor Chelyshkin</span>
        </a>
      </div>
    </header>
    <main class="not-found">
      <p class="not-found-code">
        404
        <span class="not-found-code__slice" aria-hidden="true">404</span>
        <span class="not-found-code__slice not-found-code__slice--echo" aria-hidden="true"
          >404</span
        >
      </p>
      <h1 class="not-found-title">Page not found</h1>
      <p class="not-found-message">
        The requested resource could not be located on this server. Perhaps you were looking for
        something else?
      </p>
      <nav class="not-found-actions" aria-label="Continue browsing">
        <a href="/" class="not-found-link">
          <span aria-hidden="true">←</span>
          <span class="not-found-link__label">Return to Home</span>
        </a>
        <a
          href="https://github.com/mr-chelyshkin"
          target="_blank"
          rel="noopener noreferrer"
          class="not-found-link"
          aria-label="Check GitHub (opens in a new tab)"
        >
          <span class="not-found-link__label">Check GitHub</span>
          <span aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </body>
</html>
