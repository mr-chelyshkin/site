<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340">
  <defs>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="contact-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="occlusion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="sheen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.15 0" />
    </filter>
    <clipPath id="cap">
      <rect x="30" y="24" width="250" height="250" rx="34" />
    </clipPath>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3f3" />
      <stop offset="0.45" stop-color="#cdd2d4" />
      <stop offset="0.8" stop-color="#9aa2a6" />
      <stop offset="1" stop-color="#788084" />
    </linearGradient>
    <linearGradient id="skirt-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.82" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.16" />
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.56" r="0.62">
      <stop offset="0" stop-color="#f6f7f7" />
      <stop offset="0.62" stop-color="#e9ecec" />
      <stop offset="1" stop-color="#d7dcdd" />
    </radialGradient>
    <linearGradient id="dish-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.07" />
      <stop offset="0.35" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#5f676a" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <rect x="46" y="52" width="250" height="250" rx="40" fill="#000" opacity="0.5" filter="url(#soft-shadow)" />
  <rect x="33" y="34" width="250" height="246" rx="34" fill="#000" opacity="0.38" filter="url(#contact-shadow)" />

  <g clip-path="url(#cap)">
    <rect x="30" y="24" width="250" height="250" fill="url(#skirt)" />
    <rect x="30" y="24" width="250" height="250" fill="url(#skirt-side)" />
    <rect x="30" y="24" width="250" height="250" filter="url(#grain)" />
  </g>
  <rect x="30.75" y="24.75" width="248.5" height="248.5" rx="33.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" />
  <g clip-path="url(#cap)">
    <rect x="56" y="40" width="198" height="196" rx="24" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="14" filter="url(#occlusion)" />
  </g>

  <rect x="56" y="36" width="198" height="196" rx="24" fill="url(#dish)" />
  <rect x="56" y="36" width="198" height="196" rx="24" fill="url(#dish-shade)" />
  <rect x="56" y="36" width="198" height="196" rx="24" filter="url(#grain)" clip-path="url(#cap)" />
  <ellipse cx="118" cy="82" rx="58" ry="34" fill="#ffffff" opacity="0.5" filter="url(#sheen)" />
  <rect x="58" y="38" width="194" height="192" rx="22" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.8" />
</svg>
