# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  terraform:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/terraform/Taskfile.yml
    vars:
      TERRAFORM_VERSION: '1.15.9'
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
        TF_VAR_aws_region TF_VAR_domain_name TF_VAR_site_bucket_name TF_VAR_acm_certificate_arn
        TF_VAR_turnstile_secret_key
  node:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/node/Taskfile.yml
    vars:
      NODE_VERSION: '22.23.1'
  aws:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/aws/Taskfile.yml
    vars:
      AWS_VERSION: '2.36.24'

tasks:
  run/dev:
    desc: Run dev environment
    cmds:
      - task: node:_npm/tool
        vars:
          CONTAINER_PORTS: "127.0.0.1:5173:5173"
          CMD: "sh -c 'npm install && npm run optimize-images && exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173'"

  ci/static/build:
    desc: Run static build
    cmds:
      - task: node:_npm/tool
        vars:
          CMD: "sh -c 'npm ci && npm run lint && npm run build'"

  ci/static/test:
    desc: Run static tests
    cmds:
      - task: node:run
        vars:
          SCRIPT: type-check

  ci/static/audit:
    desc: Run deps audit
    cmds:
      - task: node:audit

  ci/terraform/fmt:
    desc: Run terraform fmt
    cmds:
      - task: terraform:fmt

  ci/terraform/validate:
    desc: Run terraform validation
    cmds:
      - task: terraform:validate

  ci/terraform/plan:
    desc: Run terraform plan
    requires:
      vars: [TF_STATE_BUCKET, TF_STATE_KEY, TF_STATE_REGION]
    cmds:
      - task: terraform:plan
        vars:
          INIT_ARGS: >-
            -input=false -reconfigure -lockfile=readonly
            -backend-config=use_lockfile=true
            -backend-config=encrypt=true
            {{printf "-backend-config=bucket=%s" .TF_STATE_BUCKET | shellQuote}}
            {{printf "-backend-config=region=%s" .TF_STATE_REGION | shellQuote}}
            {{printf "-backend-config=key=%s" .TF_STATE_KEY | shellQuote}}
