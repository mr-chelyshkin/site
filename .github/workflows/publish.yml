name: Publish flow

on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check tag format
        uses: mr-chelyshkin/actions/tag-format-check@v2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        uses: mr-chelyshkin/actions/tag-branch-check@v2
        with:
          branch: main

  build:
    name: Build ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: static-site-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build static site
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/node/build
      - name: Keep the static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site-${{ github.sha }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: build
    uses: mr-chelyshkin/actions/.github/workflows/cd-aws-s3-static.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      working-directory: tf
      aws-region: ${{ vars.AWS_REGION }}
      terraform-state-bucket: ${{ vars.TF_STATE_BUCKET }}
      terraform-state-key: ${{ vars.TF_STATE_KEY }}
      terraform-state-region: ${{ vars.TF_STATE_REGION }}
      aws-role-arn: ${{ vars.AWS_TERRAFORM_DEPLOY_ROLE_ARN }}
      domain-name: ${{ vars.SITE_DOMAIN_NAME }}
      site-bucket-name: ${{ vars.SITE_BUCKET_NAME }}
      acm-certificate-arn: ${{ vars.SITE_ACM_CERTIFICATE_ARN }}
    secrets:
      terraform-vars: |
        turnstile_secret_key=${{ secrets.TURNSTILE_SECRET_KEY }}

  publish:
    name: Publish ${{ github.ref_name }}
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
