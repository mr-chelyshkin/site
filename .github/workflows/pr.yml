name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    uses: mr-chelyshkin/actions/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read

  terraform:
    uses: mr-chelyshkin/actions/.github/workflows/ci-terraform.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      aws-role-arn: ${{ vars.AWS_TERRAFORM_DEPLOY_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION }}
      env-vars: |
        {
          "TF_STATE_KEY": ${{ toJSON(vars.TF_STATE_KEY) }},
          "TF_VAR_aws_region": ${{ toJSON(vars.AWS_REGION) }},
          "TF_STATE_REGION": ${{ toJSON(vars.TF_STATE_REGION) }},
          "TF_STATE_BUCKET": ${{ toJSON(vars.TF_STATE_BUCKET) }},
          "TF_VAR_domain_name": ${{ toJSON(vars.SITE_DOMAIN_NAME) }},
          "TF_VAR_site_bucket_name": ${{ toJSON(vars.SITE_BUCKET_NAME) }},
          "TF_VAR_acm_certificate_arn": ${{ toJSON(vars.SITE_ACM_CERTIFICATE_ARN) }}
        }
    secrets:
      terraform-vars: |
        turnstile_secret_key=${{ secrets.TURNSTILE_SECRET_KEY }}

  gate:
    if: always()
    needs: [node, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@v2
        with:
          results: ${{ toJSON(needs) }}
